name: Wishes Production Deploy

on:
  workflow_run:
    workflows: [Project CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-checks:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify merged PR, required checks and resolved threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TRIGGERING_CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: node scripts/wait-for-production-checks.mjs
      - name: Record the validated revision
        id: revision
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: printf 'sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: required-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wishes-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://wishes.ks-design.art
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.required-checks.outputs.revision }}
          persist-credentials: false
      - name: Connect to the deployment Tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.WISHES_SSH_HOST }}
      - name: Publish and verify the reviewed site
        env:
          REVISION: ${{ needs.required-checks.outputs.revision }}
          WISHES_SSH_HOST: ${{ vars.WISHES_SSH_HOST }}
          WISHES_SSH_KNOWN_HOSTS: ${{ vars.WISHES_SSH_KNOWN_HOSTS }}
          WISHES_SSH_PRIVATE_KEY: ${{ secrets.WISHES_SSH_PRIVATE_KEY }}
        run: bash production/deploy.sh
