server {
    listen 80;
    listen [::]:80;
    server_name wishes.ks-design.art;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    # The local deployment health check works before and after TLS setup.
    location = /__revision {
        root /srv/wishes/current;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location / { return 301 https://wishes.ks-design.art$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wishes.ks-design.art;
    ssl_certificate /etc/letsencrypt/live/wishes.ks-design.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wishes.ks-design.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/wishes/current;
    index index.html;
    access_log /var/log/nginx/wishes.ks-design.art.access.log;
    error_log /var/log/nginx/wishes.ks-design.art.error.log warn;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
    location = /__revision { default_type text/plain; }
    location / { try_files $uri $uri/ =404; }
}
