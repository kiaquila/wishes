server {
    listen 80;
    listen [::]:80;
    server_name wishes.ks-design.art;
    root /srv/wishes/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location = /__revision { default_type text/plain; }
    location / { try_files $uri $uri/ =404; }
}
